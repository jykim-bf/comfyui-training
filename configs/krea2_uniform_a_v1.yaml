job: extension
config:
  name: krea2_uniform_a_v1
  process:
  - type: sd_trainer
    training_folder: /home/sasair/dev/training/outputs
    device: cuda:0
    trigger_word: cs01
    network:
      type: lora
      linear: 128
      linear_alpha: 128
    save:
      dtype: bf16
      save_every: 500
      max_step_saves_to_keep: 9999
      save_format: safetensors
    datasets:
    - folder_path: /home/sasair/dev/training/inputs/sheets/outfits/outfit_001/dataset
      caption_ext: txt
      caption_dropout_rate: 0.05
      shuffle_tokens: false
      cache_latents_to_disk: true
      # 의상이 좌우 비대칭(왼가슴 포켓)이라 좌우 반전 금지
      flip_x: false
      resolution:
      - 512
      - 768
      - 1024
    train:
      batch_size: 1
      steps: 10000
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false
      gradient_checkpointing: true
      noise_scheduler: flowmatch
      timestep_type: weighted
      optimizer: adamw8bit
      lr: 0.0001
      ema_config:
        use_ema: true
        ema_decay: 0.99
      dtype: bf16
    model:
      name_or_path: /home/sasair/dev/comfyui/models/diffusion_models/krea2/krea2_raw_bf16.safetensors
      arch: krea2
      quantize: true
      quantize_te: true
      low_vram: false
    sample:
      sampler: flowmatch
      sample_every: 500
      width: 768
      height: 1360
      prompts:
      - photo of a young woman with long dark hair, wearing cs01, standing facing the camera, full body, plain white studio background
      - photo of a young woman with a short bob haircut seen from directly behind, wearing cs01, standing, full back view, full body, plain white studio background
      - photo of a young woman with a ponytail, wearing cs01 without the necktie, walking on a sunny street, full body, natural daylight
      neg: blurry, low quality, cartoon, illustration, bad anatomy, wide-angle lens distortion
      seed: 42
      walk_seed: true
      guidance_scale: 4
      sample_steps: 30
meta:
  name: krea2_uniform_a_v1
  version: '1.0'
